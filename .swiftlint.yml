# SwiftLint Configuration for SIROS SDK

disabled_rules:
  - trailing_whitespace
  - line_length
  - trailing_comma

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fatal_error_message
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - unowned_variable_capture

excluded:
  - .build
  - Package.swift
  - Tests/
  - Sources/SirosKeystore/Generated
  # Same reason: UniFFI output, regenerated by `make bindings-swift` in the
  # crate. zk_cred_longfellow.swift only escaped this because it happens to
  # fit under file_length; zk_cred_bbs.swift is 1770 lines and does not.
  # Editing generated code to satisfy a linter would be undone by the next
  # regeneration.
  - Sources/SirosCredentials/Generated

force_cast: warning
force_try: warning

type_body_length:
  warning: 500
  error: 1200

file_length:
  warning: 700
  error: 1500

function_body_length:
  warning: 60
  error: 120

identifier_name:
  min_length: 1
  allowed_symbols:
    - _
  excluded:
    - id
    - iv
    - ks

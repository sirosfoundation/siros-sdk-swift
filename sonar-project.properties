sonar.projectKey=sirosfoundation_siros-sdk-swift
sonar.organization=sirosfoundation

sonar.sources=Sources
sonar.tests=Tests

# Exclude test sources and build artifacts from main analysis
sonar.exclusions=Tests/**,.build/**

# No coverage tooling configured yet — exclude from coverage gate
sonar.coverage.exclusions=**/*

# UniFFI-generated FFI glue (e.g. Sources/*/Generated/*.swift, vendored
# verbatim from siros-wscd-manager/zk-cred-longfellow's `uniffi-bindgen`
# output) is never hand-edited, so its repetitive per-type lift/lower
# boilerplate isn't real duplication to fix - it's regenerated wholesale on
# every native-crate version bump. Exclude it from the duplication (CPD)
# check specifically, while still leaving it in scope for other Sonar
# analysis (issues, etc).
sonar.cpd.exclusions=Sources/**/Generated/**

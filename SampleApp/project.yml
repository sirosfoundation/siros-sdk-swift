name: SirosSampleApp
options:
  bundleIdPrefix: org.siros.sdk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

packages:
  SirosSDK:
    path: ../
  SVGView:
    url: https://github.com/exyte/SVGView
    from: 1.0.6

targets:
  SirosSampleApp:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: SirosSDK
        product: SirosWallet
      - package: SirosSDK
        product: SirosCredentials
      - package: SirosSDK
        product: SirosAuth
      - package: SirosSDK
        product: SirosKeystore
      - package: SirosSDK
        product: SirosFlow
      - package: SVGView
        product: SVGView
    settings:
      base:
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.siros.sdk.sample
        PRODUCT_NAME: SirosSampleApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: 3
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X3YM693CZ3
        ALWAYS_SEARCH_USER_PATHS: "NO"
        CODE_SIGN_ENTITLEMENTS: SampleApp.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: SIROS Sample
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - siros-sample
              - openid-credential-offer
              - openid4vp
              - haip
        NSCameraUsageDescription: "Camera is used to scan QR codes and for identity verification via 3D liveness detection."
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to advertise device engagement and present credentials directly to a nearby ISO 18013-5 mdoc reader."
        NSFaceIDUsageDescription: "Face ID is used to authenticate and protect your credentials."
        NFCReaderUsageDescription: "NFC is used to communicate with a security key for FIDO2 authentication."
        ITSAppUsesNonExemptEncryption: false

  SirosSampleAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SirosSampleApp
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        ALWAYS_SEARCH_USER_PATHS: "NO"

schemes:
  SirosSampleApp:
    build:
      targets:
        SirosSampleApp: all
        SirosSampleAppTests: [test]
    test:
      config: Debug
      targets:
        - SirosSampleAppTests
    run:
      config: Debug
